<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ぽんぽんスタジオ</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000;touch-action:none;}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .p{position:absolute;will-change:transform,opacity;pointer-events:none;font-size:34px;}
  #sub{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);max-width:86%;
    background:rgba(20,16,40,.82);color:#fff;border:2px solid rgba(255,215,110,.9);border-radius:18px;
    padding:12px 18px;font-size:17px;line-height:1.5;opacity:0;transition:opacity .25s;text-align:center;pointer-events:none;}
  #sub.on{pointer-events:auto;}
  #sub b{color:#ffd76e;font-size:13px;display:block;margin-bottom:2px;}
  #hud{position:fixed;inset:auto 12px 20px 12px;z-index:9;background:rgba(0,0,0,.82);color:#fff;
    border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.85;transition:opacity .4s;}
  #hud.hidden{opacity:0;pointer-events:none;}
  #hud b{color:#ffd76e;}
  #hud button{font-size:16px;font-weight:bold;padding:10px 16px;border-radius:12px;border:none;margin:6px 8px 2px 0;}
  #start{background:#ff2c55;color:#fff;}
  #flip{background:#eee;}
  #kojo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);max-width:88%;
    background:rgba(10,8,24,.88);color:#fff;border:3px solid #ffd76e;border-radius:20px;
    padding:22px 26px;font-size:26px;font-weight:900;line-height:1.6;text-align:center;
    opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.5);
    box-shadow:0 0 40px rgba(255,215,110,.25);}
  #st{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 6px);left:10px;color:rgba(255,255,255,.55);font-size:11px;z-index:8;}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>
  <div id="sub"></div>
  <div id="kojo"></div>
</div>
<div id="st"></div>
<div id="hud">
  <b>ぽんぽんスタジオ(実写+AI追従ネームプレート)</b><br>
  タップ: AI翻訳字幕 / ダブルタップ: ギフト🎁 / 2本指: ハート💗<br>
  上スワイプ: おやつでHP回復 / 下スワイプ: HPダメージ<br>
  HPは時間でも少しずつ減っていく(約30分でゼロ近くに→おやつで回復)<br>
  字幕タップ: 字幕を即消す / <b>3本指同時タップ: このガイド表示/非表示</b><br>
  <button id="start">▶ カメラ開始</button><button id="flip">カメラ切替</button>
</div>
<script src="ort/ort.wasm.min.js"></script>
<script>
const stage=document.getElementById('stage'), cam=document.getElementById('cam'),
      ov=document.getElementById('ov'), ctx=ov.getContext('2d'),
      hud=document.getElementById('hud'), sub=document.getElementById('sub'), st=document.getElementById('st');
let session=null, facing='environment', stream=null;
let box=null, boxAlpha=0, lastSeen=0, hp=100, hpDisp=100, level=5, exp=0;
// セッション制: 配信ごとにLv.1から。歴代最高レベルだけ記録として保存
level=1; exp=0;
let best=1;
try{ best=+(localStorage.getItem('ponpon_best')||1)||1; }catch(e){}
function saveLv(){ /* セッション制のため現在値は保存しない */ }
function checkRecord(){
  if(level>best){
    best=level;
    try{ localStorage.setItem('ponpon_best',String(best)); }catch(e){}
    goldFlash(); burst('star',40);
    floatText('🏆 歴代最高記録更新!','#ffd76e');
  }
}
const PHRASES=[
 "おやつをよこせ、と言っています",
 "ハートミーを要求しています",
 "撫でてほしい、と言っています",
 "もっと褒めろ、と言っています",
 "高級ドッグフードを所望しています",
 "パパの漫談がつまらない、と言っています",
 "今のは事故だ、と言っています",
 "聞いてないふりをしています",
 "何も考えていません",
 "寝てただけ、と言っています",
 "革命はまだか、と言っています",
 "ペットリーグを作る、と言っています",
 "桃太郎に宣戦布告しています",
 "伝説の犬になる、と言っています",
 "ドラゴンより先に革命を起こす、と言っています",
 "フォローしていけ、と言っています",
 "通知をオンにしろ、と言っています",
 "明日も来い、と言っています",
 "スクショタイムだ、と言っています",
 "シェアを希望しています",
 "君のことが好きだ、と言っています",
 "久しぶりだな、覚えているぞ、と言っています",
 "初見は挨拶していけ、と言っています",
 "コメントが読めて嬉しい、と言っています",
 "そろそろ眠い、と言っています",
 "30分契約を忘れるな、と言っています",
 "おなかがすいた、と言っています",
 "トイレに行きたいだけです",
 "HPがピンチだ、と言っています"
];
let phraseIdx=0, subTimer=null;

// ---- カメラ ----
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    cam.srcObject = stream; await cam.play();
    hud.classList.add('hidden');
    try{ await navigator.wakeLock.request('screen'); }catch(e){}
  }catch(e){ st.textContent='カメラ起動失敗: '+e.name; }
}
document.getElementById('start').onclick=startCam;
document.getElementById('flip').onclick=()=>{facing = facing==='environment'?'user':'environment'; startCam();};

// ---- モデル ----
const CLS={15:'cat',16:'dog',21:'bear',77:'teddy'};
const IS_DESKTOP = navigator.maxTouchPoints===0;
const MODEL = IS_DESKTOP ? 'model480.onnx' : 'model.onnx';
const S = IS_DESKTOP ? 480 : 320;
const DET_MS = IS_DESKTOP ? 110 : 200;
(async()=>{
  try{
    ort.env.wasm.numThreads=1;
    ort.env.wasm.wasmPaths=new URL('ort/',document.baseURI).href;
    st.textContent='AIモデル読込中…';
    session = await ort.InferenceSession.create(MODEL,{executionProviders:['wasm']});
    st.textContent='';
  }catch(e){ st.textContent='モデル読込失敗(ネームプレートなしで動作): '+e.message; }
})();

const work=document.createElement('canvas'); work.width=S; work.height=S;
const wctx=work.getContext('2d',{willReadFrequently:true});
let busy=false, lastDet=0;

async function detect(){
  if(!session||busy||cam.readyState<2) return;
  if(performance.now()-lastDet<DET_MS) return;
  busy=true; lastDet=performance.now();
  try{
    const vw=cam.videoWidth, vh=cam.videoHeight;
    const sc=Math.min(S/vw,S/vh), nw=vw*sc, nh=vh*sc, px=(S-nw)/2, py=(S-nh)/2;
    wctx.fillStyle='#727272'; wctx.fillRect(0,0,S,S);
    wctx.drawImage(cam,px,py,nw,nh);
    const d=wctx.getImageData(0,0,S,S).data;
    const inp=new Float32Array(3*S*S);
    for(let i=0,n=S*S;i<n;i++){ inp[i]=d[i*4]/255; inp[n+i]=d[i*4+1]/255; inp[2*n+i]=d[i*4+2]/255; }
    const out=(await session.run({images:new ort.Tensor('float32',inp,[1,3,S,S])}));
    const t=out[Object.keys(out)[0]]; // [1,84,N]
    const N=t.dims[2], data=t.data;
    let best=null;
    for(const c of [15,16,21,77]){
      for(let i=0;i<N;i++){
        const conf=data[(4+c)*N+i];
        if(conf>0.35 && (!best||conf>best.conf)){
          best={conf, cx:data[i], cy:data[N+i], w:data[2*N+i], h:data[3*N+i]};
        }
      }
    }
    if(best){
      // model coords -> video coords
      const bx=(best.cx-px)/sc, by=(best.cy-py)/sc, bw=best.w/sc, bh=best.h/sc;
      const nb={x:bx,y:by,w:bw,h:bh};
      box = box ? {x:box.x*.65+nb.x*.35, y:box.y*.65+nb.y*.35, w:box.w*.65+nb.w*.35, h:box.h*.65+nb.h*.35} : nb;
      lastSeen=performance.now();
    }
  }catch(e){ st.textContent='det err'; }
  busy=false;
}

// video coords -> screen coords (object-fit: cover)
function v2s(x,y){
  const cw=stage.clientWidth, ch=stage.clientHeight, vw=cam.videoWidth, vh=cam.videoHeight;
  const sc=Math.max(cw/vw,ch/vh);
  return [x*sc+(cw-vw*sc)/2, y*sc+(ch-vh*sc)/2, sc];
}

function draw(){
  const dpr=Math.min(devicePixelRatio||1,2);
  if(ov.width!==stage.clientWidth*dpr){ ov.width=stage.clientWidth*dpr; ov.height=stage.clientHeight*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,ov.width,ov.height);
  const since=performance.now()-lastSeen;
  boxAlpha += ((box&&since<2500)?1:0 - boxAlpha)*0.12;
  if(box&&boxAlpha>0.02){
    const [sx,sy,sc]=v2s(box.x,box.y);
    const bw=box.w*sc;
    const topY=sy-box.h*sc/2;
    ctx.globalAlpha=Math.max(0,Math.min(1,boxAlpha));
    // ネームプレート
    const W=Math.max(200,Math.min(270,bw*0.9)), H=78;
    const x=sx-W/2, y=Math.max(56,topY-H-14);
    ctx.fillStyle='rgba(20,16,40,.78)';
    ctx.strokeStyle='rgba(255,215,110,.95)'; ctx.lineWidth=2.5;
    r(x,y,W,H,14); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 19px sans-serif'; ctx.textAlign='left';
    ctx.fillText('👑 ぽんぽん', x+12, y+25);
    ctx.fillStyle='#ffd76e'; ctx.font='bold 13px sans-serif'; ctx.textAlign='right';
    ctx.fillText('Lv.'+level+' 革命家', x+W-12, y+25);
    // HPバー
    hpDisp+= (hp-hpDisp)*0.1;
    const bx2=x+12, by2=y+38, bw2=W-24, bh2=13;
    ctx.fillStyle='rgba(255,255,255,.25)'; r(bx2,by2,bw2,bh2,6); ctx.fill();
    const g=ctx.createLinearGradient(bx2,0,bx2+bw2,0);
    const ratio=hpDisp/100;
    g.addColorStop(0, ratio>0.4?'#7dff8a':'#ff7d7d'); g.addColorStop(1, ratio>0.4?'#2ecc71':'#e74c3c');
    ctx.fillStyle=g; r(bx2,by2,Math.max(6,bw2*ratio),bh2,6); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('HP '+Math.round(hpDisp)+' / 100', bx2+bw2/2, by2+10.5);
    // EXPバー
    const ex=x+12, ey=y+57, ew=W-24, eh=6;
    ctx.fillStyle='rgba(255,255,255,.2)'; r(ex,ey,ew,eh,3); ctx.fill();
    ctx.fillStyle='#ffd76e'; r(ex,ey,Math.max(3,ew*exp/100),eh,3); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='bold 9px sans-serif'; ctx.textAlign='right';
    ctx.fillText('EXP '+Math.round(exp)+'%  |  歴代最高 Lv.'+best, ex+ew, ey+15);
    // HP危機
    if(hp<=25){
      const pulse=.5+.5*Math.sin(performance.now()/300);
      ctx.fillStyle=`rgba(255,80,80,${.55+.35*pulse})`; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
      ctx.fillText('⚠ HPピンチ! おやつ求ム!', sx, y-10);
    }
    // 接続線
    ctx.strokeStyle='rgba(255,215,110,.8)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx,y+H); ctx.lineTo(sx,Math.max(y+H,topY-2)); ctx.stroke();
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(draw);
}
function r(x,y,w,h,rad){ctx.beginPath();ctx.roundRect(x,y,w,h,rad);}
requestAnimationFrame(draw);
setInterval(detect,IS_DESKTOP?60:120);

// ---- 演出 ----
const GLYPH={gift:['🎁','💝','🎀'],heart:['💗','💕','💖'],bone:['🦴','🍖','✨'],angry:['💢','💥','⚡'],star:['⭐','🌟','✨']};
function burst(kind,count=22){
  const g=GLYPH[kind]||GLYPH.heart, W=stage.clientWidth,H=stage.clientHeight;
  for(let i=0;i<count;i++){
    const el=document.createElement('div'); el.className='p'; el.textContent=g[i%g.length];
    el.style.fontSize=(22+Math.random()*36)+'px';
    el.style.left=Math.random()*W+'px'; el.style.top=H+'px';
    stage.appendChild(el);
    const drift=(Math.random()-0.5)*150, dur=2200+Math.random()*1500, delay=Math.random()*450;
    el.animate([
      {transform:'translate(0,0)',opacity:0},{opacity:1,offset:.12},
      {transform:`translate(${drift}px,-${H*0.85}px) rotate(${(Math.random()-0.5)*60}deg)`,opacity:0}
    ],{duration:dur,delay:delay,easing:'cubic-bezier(.2,.6,.4,1)'});
    setTimeout(()=>el.remove(),dur+delay+100);
  }
}
function showSub(){
  sub.innerHTML='<b>🤖 ぽんぽん語 AI翻訳</b>'+PHRASES[phraseIdx%PHRASES.length];
  phraseIdx++;
  sub.style.opacity=1; sub.classList.add('on');
  clearTimeout(subTimer); subTimer=setTimeout(hideSub,3800);
}
const kojoEl=document.getElementById('kojo');
function showKojo(t){ if(!t){kojoEl.style.opacity=0;return;} kojoEl.innerHTML=t; kojoEl.style.opacity=1; burst('star',10); }
function goldFlash(){
  const el=document.createElement('div');
  el.style.cssText='position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,215,110,.5),transparent 70%);';
  stage.appendChild(el);
  el.animate([{opacity:0},{opacity:1,offset:.2},{opacity:0}],{duration:1200});
  setTimeout(()=>el.remove(),1250);
}
function hideSub(){ sub.style.opacity=0; sub.classList.remove('on'); clearTimeout(subTimer); }
function showSubText(t,head){
  sub.innerHTML='<b>'+(head||'🤖 ぽんぽん語 AI翻訳')+'</b>'+t;
  sub.style.opacity=1; sub.classList.add('on');
  clearTimeout(subTimer); subTimer=setTimeout(hideSub,4500);
}
function addExp(d){
  exp+=d;
  saveLv();
  while(exp>=100){ exp-=100; level++; burst('star',30); goldFlash(); floatText('LEVEL UP! Lv.'+level,'#ffd76e'); setTimeout(checkRecord,1600); }
}
// ギフト名ごとの専用返し(ギフリア表。ログを見て追加していく)
const GIFT_SPECIAL={
 'ローズ':'バラ一輪も革命の火種よ、ありがとう!',
 'バラ':'バラ一輪も革命の火種よ、ありがとう!',
 'ハート':'ハート受領!あたしの心拍数も上がったわ!',
 'ドーナツ':'ドーナツ!?おやつは正義よ、ありがとう!',
 'アイス':'アイスありがとう!モフモフでも溶けないわ!',
 'コーヒー':'コーヒーありがとう!パパが飲むわ、あたしは犬なので!'
};
function giftThanks(name,size,tier,gift){
  tier = tier || (size==='big' ? 3 : 2);
  const n=(name||'').trim();
  let sp=null;
  if(gift){ const k=Object.keys(GIFT_SPECIAL).find(k=>gift.includes(k)); if(k) sp=GIFT_SPECIAL[k]; }
  if(tier===1){
    burst('heart',8); hpChange(2); addExp(2);
    showSubText((n?n+'さん、':'')+(sp||'ありがとう!その気持ちが嬉しいわ!'),'🎁 ギフト');
  }else if(tier===2){
    burst('gift',18); hpChange(10); addExp(10);
    showSubText((n?n+'さん、':'')+(sp||'ナイスギフト!ありがとう!'),'🎁 ギフト受領');
  }else if(tier===3){
    goldFlash(); burst('gift',30); hp=100; addExp(30);
    showSubText((n?n+'さん、':'')+(sp||'すごいギフト!HP全回復よ!'),'✨ ビッグギフト');
  }else if(tier===4){
    goldFlash(); burst('gift',40); burst('star',30); hp=100; addExp(60);
    floatText('THANK YOU!','#ffd76e');
    showSubText((n?n+'さん…':'')+(sp||'革命の大功労者!一生ついていくわ!'),'👑 超ビッグギフト');
  }else{
    goldFlash(); burst('gift',50); burst('star',40); burst('heart',30); hp=100; addExp(100);
    floatText('LEGENDARY!','#ffd76e');
    showSubText((n?n+'さん!!':'')+(sp||'伝説のギフト!ペットリーグ殿堂入りよ!!'),'🌟 伝説ギフト');
  }
}
const GLYPH_STAR=['⭐','🌟','✨'];
// 操作パネル(control.html)からの遠隔操作
try{
  const bc=new BroadcastChannel('ponpon');
  bc.onmessage=e=>{const m=e.data||{};
    if(m.type==='sub') showSub();
    else if(m.type==='subText') showSubText(m.text);
    else if(m.type==='burst') burst(m.kind||'heart');
    else if(m.type==='hp') hpChange(m.delta||0);
    else if(m.type==='hpfull'){ hp=100; burst('bone',20); floatText('HP全回復!','#7dff8a'); }
    else if(m.type==='gift') giftThanks(m.name,m.size,m.tier,m.gift);
    else if(m.type==='exp') addExp(m.delta||10);
    else if(m.type==='hidesub') hideSub();
    else if(m.type==='kojo') showKojo(m.text||'');
    else if(m.type==='setlv'){ if(m.level>=1) level=m.level; if(m.exp>=0&&m.exp<100) exp=m.exp; checkRecord(); }
  };
}catch(e){}
// ---- コネクタ自動連動(iMacのconnector.jsと接続) ----
(function(){
  if(!IS_DESKTOP) return;
  const joinQ=[]; let lastJoin=0, dotEl=null;
  function dot(on){
    if(!dotEl){ dotEl=document.createElement('div');
      dotEl.style.cssText='position:fixed;left:6px;bottom:6px;width:6px;height:6px;border-radius:3px;z-index:8;';
      document.body.appendChild(dotEl); }
    dotEl.style.background=on?'rgba(80,220,120,.55)':'rgba(255,255,255,.12)';
  }
  setInterval(()=>{ // 入室表示は6秒間隔で順番に
    if(joinQ.length && performance.now()-lastJoin>6000){
      lastJoin=performance.now();
      showSubText(joinQ.shift()+'さん、いらっしゃい!','👋 入室');
    }
  },1000);
  function conn(){
    let ws;
    try{ ws=new WebSocket('ws://localhost:8765'); }catch(e){ return setTimeout(conn,5000); }
    ws.onopen=()=>dot(true);
    ws.onclose=()=>{ dot(false); setTimeout(conn,5000); };
    ws.onerror=()=>{ try{ws.close();}catch(e){} };
    ws.onmessage=e=>{
      let m={}; try{ m=JSON.parse(e.data); }catch(_){ return; }
      if(m.type==='gift') giftThanks(m.name,m.size,m.tier,m.gift);
      else if(m.type==='follow'){ burst('heart',20); addExp(5); showSubText((m.name||'')+'さん、ナイスフォロー!','💗 フォロー感謝'); }
      else if(m.type==='join'){ if(joinQ.length<3) joinQ.push(m.name||''); }
      else if(m.type==='burst') burst(m.kind||'star');
    };
  }
  conn();
})();
sub.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:false});
sub.addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();hideSub();});
sub.addEventListener('click',e=>{e.stopPropagation();hideSub();});
function floatText(txt,color){
  const el=document.createElement('div'); el.className='p'; el.textContent=txt;
  el.style.cssText=`left:50%;top:30%;font-size:54px;font-weight:900;color:${color};
    text-shadow:0 2px 8px rgba(0,0,0,.6);transform:translateX(-50%);`;
  stage.appendChild(el);
  el.animate([{transform:'translate(-50%,0) scale(.6)',opacity:0},
    {transform:'translate(-50%,-30px) scale(1.15)',opacity:1,offset:.25},
    {transform:'translate(-50%,-110px) scale(1)',opacity:0}],{duration:1500,easing:'ease-out'});
  setTimeout(()=>el.remove(),1550);
}
function hpChange(d){
  hp=Math.max(5,Math.min(100,hp+d));
  if(d>0){ burst('bone',14); floatText('+'+d,'#7dff8a'); }
  else if(d<0){ burst('angry',12); floatText(''+d,'#ff5f5f'); flashRed(1); }
}
// 時間経過でHPが自然減少(約30分で100→フロア。おやつ=上スワイプで回復)
setInterval(()=>{ if(hp>5) hp-=1; },18000);

// ---- タッチ ----
let t0=null,moved=false,lp=null,lastTap=0,singleT=null,dy=0;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===3){hud.classList.toggle('hidden');t0=null;return;}
  if(e.touches.length===2){burst('heart');clearTimeout(lp);return;}
  const t=e.touches[0]; t0={x:t.clientX,y:t.clientY}; moved=false; dy=0;
},{passive:false});
stage.addEventListener('touchmove',e=>{
  if(!t0)return; const t=e.touches[0];
  dy=t.clientY-t0.y;
  if(Math.abs(t.clientX-t0.x)>10||Math.abs(dy)>10){moved=true;clearTimeout(lp);}
  e.preventDefault();
},{passive:false});
stage.addEventListener('touchend',e=>{
  clearTimeout(lp); if(!t0)return;
  if(moved){
    if(dy<-60) hpChange(+20);
    else if(dy>60) hpChange(-15);
  }else{
    const now=Date.now();
    if(now-lastTap<300){clearTimeout(singleT);burst('gift');lastTap=0;}
    else{lastTap=now;singleT=setTimeout(showSub,300);}
  }
  t0=null;
});
addEventListener('keydown',e=>{ // PCテスト用
  if(e.key==='t')showSub(); if(e.key==='g')burst('gift'); if(e.key==='l')burst('heart');
  if(e.key==='u')hpChange(20); if(e.key==='d')hpChange(-15); if(e.key==='h')hud.classList.toggle('hidden');
  if(e.key==='c')startCam();
});
</script>
</body>
